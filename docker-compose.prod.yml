services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: manga_shelf_app
    restart: unless-stopped
    ports:
      - "127.0.0.1:3002:3000"
    environment:
      - DATABASE_URL=postgresql://manga_user:${POSTGRES_PASSWORD:-manga_secure_pass}@db:5432/manga_shelf?schema=public
      - AUTH_SECRET=${AUTH_SECRET:-${NEXTAUTH_SECRET:-manga-super-secret-auth-key-change-me}}
      - AUTH_TRUST_HOST=true
      - NEXTAUTH_SECRET=${AUTH_SECRET:-${NEXTAUTH_SECRET:-manga-super-secret-auth-key-change-me}}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-https://manga.daqu.eu}
      - NODE_ENV=production
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - manga_shelf_network

  db:
    image: postgres:15-alpine
    container_name: manga_shelf_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: manga_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-manga_secure_pass}
      POSTGRES_DB: manga_shelf
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - manga_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U manga_user -d manga_shelf"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - manga_shelf_network

networks:
  manga_shelf_network:
    driver: bridge

volumes:
  manga_postgres_data:
